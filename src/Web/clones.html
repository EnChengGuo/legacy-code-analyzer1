<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>CodeAtlas 重複程式碼</title>
<link rel="stylesheet" href="/style.css">
<style>
body{overflow:auto;height:auto;min-height:100vh}
main{max-width:1200px;margin:0 auto;padding:12px 16px}
.row{margin:6px 0}
.clone{background:var(--card);border:1px solid var(--line);border-radius:8px;margin:10px 0;padding:8px 12px}
.clone h3{margin:0 0 6px;font-size:14px}.pair{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.site{min-width:0}.site .loc{font-size:12px;color:var(--mut);margin-bottom:2px;word-break:break-all}
pre{margin:0;background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:6px;font:12px/1.4 Consolas,monospace;overflow:auto;max-height:260px}
.tag{display:inline-block;border-radius:4px;padding:0 6px;font-size:12px;background:var(--hit)}.tag.ex{background:#fecaca;color:#7f1d1d}
</style>
</head>
<body>
<header>
  <a href="/">🏠 總覽</a><a href="/classes">類別圖與關係圖</a><a href="/flow">函式流程</a><a href="/canvas">流程畫布</a>
  <a href="/god">God Class 解剖</a><a href="/clones" class="cur">重複程式碼</a>
  <span class="grow"></span><span id="status" class="mut"></span>
</header>
<main>
  <div class="row">
    <label>比對長度 <input type="number" id="window" value="40" min="10" max="400"> 個語法標記</label>
    <label>至少 <input type="number" id="lines" value="6" min="2" max="200"> 行</label>
    <label class="chk"><input type="checkbox" id="exact"> 只找完全相同(連變數名稱、常數都一樣)</label>
    <label class="chk"><input type="checkbox" id="gen"> 包含 Designer / 自動產生的檔案</label>
    <button id="go" type="button">開始偵測</button>
  </div>
  <div class="mut small">預設會把變數名稱、常數當成一樣,所以「複製貼上後改了名字」的也抓得到。標記數越小越敏感,但雜訊越多。</div>
  <div id="out" class="row"></div>
</main>
<script src="/common.js"></script>
<script src="/clones.js"></script>
</body>
</html>
