<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>CodeAtlas 開啟專案</title>
<link rel="stylesheet" href="/style.css">
<style>
body{height:auto;min-height:100vh;overflow:auto}
main{max-width:1100px;margin:0 auto;padding:16px 20px}
h1{font-size:20px;margin:6px 0 2px}.lead{color:var(--mut);margin:0 0 12px}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:12px 14px;margin:12px 0}
.card h2{font-size:14px;margin:0 0 8px}
.pathrow{display:flex;gap:8px}.pathrow input{flex:1;padding:8px 10px;font-size:14px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--fg);font-family:Consolas,"Microsoft JhengHei",monospace}
.pathrow button{padding:8px 18px;font-size:14px;background:var(--acc);color:#fff;border-color:var(--acc);border-radius:8px}
.pathrow button:disabled{opacity:.5;cursor:wait}
.two{display:grid;grid-template-columns:1fr 1fr;gap:14px}@media(max-width:820px){.two{grid-template-columns:1fr}}
.list{max-height:300px;overflow:auto;border:1px solid var(--line);border-radius:8px;background:var(--bg)}
.it{padding:5px 10px;cursor:pointer;display:flex;gap:8px;justify-content:space-between;align-items:center;border-bottom:1px solid var(--line);font-size:13px}
.it:last-child{border-bottom:0}.it:hover{background:var(--card)}.it .sub{color:var(--mut);font-size:12px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.it.file{font-weight:600;color:var(--acc)}.it .x{color:var(--mut);padding:0 6px}.it .x:hover{color:#dc2626}
.crumb{font-size:12px;color:var(--mut);margin-bottom:6px;word-break:break-all}.crumb a{color:var(--acc);cursor:pointer;margin-right:4px}
.msg{padding:8px 12px;border-radius:8px;margin:8px 0;font-size:13px}.msg.err{background:#fdeaea;color:#7f1d1d}.msg.ok{background:#e6f6ec;color:#14532d}.msg.info{background:var(--card);border:1px solid var(--line)}
@media(prefers-color-scheme:dark){.msg.err{background:#4a1d1d;color:#fecaca}.msg.ok{background:#173a24;color:#bbf7d0}}
#log{font:12px/1.5 Consolas,monospace;color:var(--mut);max-height:160px;overflow:auto;white-space:pre-wrap;margin-top:6px}
.spin{display:inline-block;width:12px;height:12px;border:2px solid var(--acc);border-top-color:transparent;border-radius:50%;animation:s 0.8s linear infinite;vertical-align:-2px;margin-right:6px}@keyframes s{to{transform:rotate(360deg)}}
textarea{width:100%;height:70px;font:12px/1.4 Consolas,monospace;background:var(--bg);color:var(--fg);border:1px solid var(--line);border-radius:6px;padding:6px}
details summary{cursor:pointer;color:var(--acc);font-size:13px}
.tips{font-size:12px;color:var(--mut);margin-top:6px}
</style>
</head>
<body>
<header>
  <a href="/open" class="cur">📂 開啟專案</a>
  <span class="grow"></span><span id="status" class="mut"></span>
</header>
<main>
  <h1>開啟專案</h1>
  <p class="lead">輸入 .sln 或 .csproj 的路徑,或在下方瀏覽資料夾。也可以直接輸入專案所在的資料夾。</p>

  <div class="card">
    <div class="pathrow">
      <input id="path" type="text" placeholder="例:D:\Work\MyApp\MyApp.sln" autofocus spellcheck="false">
      <button id="go" type="button">開啟</button>
    </div>
    <div class="tips">可以直接貼上含引號的路徑(例如從檔案總管「複製為路徑」);也可以只貼資料夾,程式會在裡面(含下三層)找 .sln 或 .csproj。</div>
    <details style="margin-top:8px"><summary>進階:用原始碼取代 DLL</summary>
      <div class="tips">每行一個「DLL名稱=原始碼位置」(位置是 .csproj 或資料夾;相對路徑以方案所在資料夾為準)。方案旁的 <code>codeatlas.sources</code> 會自動套用。</div>
      <textarea id="sources" placeholder="Lib=..\Lib\Lib.csproj" spellcheck="false"></textarea>
    </details>
    <div id="result"></div>
    <div id="cands" class="list" hidden></div>
  </div>

  <div id="current" class="card" hidden></div>

  <div class="two">
    <div class="card"><h2>最近開啟</h2><div id="recent" class="list"></div></div>
    <div class="card"><h2>瀏覽資料夾</h2>
      <div id="crumb" class="crumb"></div>
      <div id="browse" class="list"></div>
    </div>
  </div>
</main>
<script src="/common.js"></script>
<script src="/nav.js"></script>
<script src="/open.js"></script>
</body>
</html>
